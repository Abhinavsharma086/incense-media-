<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Connecting WhatsApp Chat...</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: #111b21;
      color: #e9edef;
    }
    .box { text-align: center; }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255,255,255,0.1);
      border-top-color: #25d366;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h2 { font-size: 16px; font-weight: 600; margin: 0; }
  </style>
</head>
<body>
  <div class="box">
    <div class="spinner"></div>
    <h2>Connecting WhatsApp Web...</h2>
  </div>
  <script>
    (function() {
      var params = new URLSearchParams(window.location.search);
      var phone = (params.get('phone') || '').replace(/[^0-9]/g, '');
      if (phone.length === 10) phone = '91' + phone;
      var text = params.get('text') || '';
      var encoded = text ? ('&text=' + encodeURIComponent(text)) : '';
      if (phone) {
        window.location.replace('https://web.whatsapp.com/send?phone=' + phone + encoded);
      } else {
        window.location.replace('https://web.whatsapp.com');
      }
    })();
  </script>
</body>
</html>
